<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Authentication | Student Performance Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 180px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 2.5rem 2rem;
      border-top: 3px solid var(--accent-violet);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent-violet);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 1rem;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
    }

    .role-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.35);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="app-navbar">
    <div class="container nav-content">
      <a href="/" class="brand-logo">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <h1>Student Analytics Portal</h1>
          <p>Teacher Portal</p>
        </div>
      </a>

      <div class="nav-actions">
        <!-- Torch Controls -->
        <div class="torch-toolbar">
          <button class="torch-mode-btn btn-mode-cyan" data-mode="cyan" title="Cyan"></button>
          <button class="torch-mode-btn btn-mode-emerald" data-mode="emerald" title="Emerald"></button>
          <button class="torch-mode-btn btn-mode-violet active" data-mode="violet" title="Violet"></button>
          <button class="torch-mode-btn btn-mode-amber" data-mode="amber" title="Amber"></button>
          <button class="torch-toggle-btn" title="Toggle Spotlight Beam (Alt+F)">
            🔦 <span style="font-size:0.75rem;">Beam</span>
          </button>
        </div>

        <a href="/student/login" class="btn btn-outline btn-sm">Switch to Student Portal</a>
      </div>
    </div>
  </header>

  <main class="container auth-wrapper">
    <div class="torch-target auth-card">
      <div class="auth-header">
        <div class="auth-icon">👨‍🏫</div>
        <div class="role-badge-pill">Faculty Portal</div>
        <h1 style="font-size: 1.7rem; margin-bottom: 0.35rem;">Teacher Sign In</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem;">
          Authenticate with faculty credentials to manage class marks, attendance, and analytics.
        </p>
      </div>

      <!-- Quick Fill Helper for Demo -->
      <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 0.75rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 0.8rem; color: var(--text-muted);">Demo Credentials:</span>
        <button id="btn-autofill-teacher" class="btn btn-secondary btn-sm" style="font-size: 0.75rem;">
          ⚡ Auto-fill Teacher
        </button>
      </div>

      <!-- Error / Role Alert Box -->
      <div id="auth-alert" style="display:none; padding: 0.85rem; border-radius: 10px; font-size: 0.86rem; margin-bottom: 1.25rem;"></div>

      <form id="teacher-login-form">
        <div class="form-group">
          <label class="form-label" for="teacher-email">Faculty Email Address</label>
          <input type="email" id="teacher-email" class="form-control" placeholder="teacher@portal.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="teacher-password">Password</label>
          <input type="password" id="teacher-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-violet btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Sign In to Teacher Dashboard
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.84rem; color: var(--text-dim);">
        Are you a student? <a href="/student/login" style="color: var(--accent-cyan); text-decoration: none; font-weight: 600;">Go to Student Portal →</a>
      </div>
    </div>
  </main>

  <script src="/js/flashlight.js"></script>
  <script src="/js/dot-matrix-shader.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('teacher-login-form');
    const alertBox = document.getElementById('auth-alert');
    const btnSubmit = document.getElementById('btn-submit');
    const btnAutofill = document.getElementById('btn-autofill-teacher');

    // Auto-fill button
    btnAutofill.addEventListener('click', () => {
      document.getElementById('teacher-email').value = 'teacher@portal.edu';
      document.getElementById('teacher-password').value = 'teacher123';
      window.showToast('Demo teacher credentials populated', 'info');
    });

    // Check query params for demo flag
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('demo') === 'teacher') {
      btnAutofill.click();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('teacher-email').value.trim();
      const password = document.getElementById('teacher-password').value;

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = 'Authenticating...';

      try {
        const res = await fetch('/api/auth/teacher/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          // If student tried to log in through teacher portal
          if (data.roleMismatch) {
            alertBox.style.display = 'block';
            alertBox.style.background = 'rgba(245, 158, 11, 0.15)';
            alertBox.style.border = '1px solid #f59e0b';
            alertBox.style.color = '#fbbf24';
            alertBox.innerHTML = `
              <strong>Role Access Violation:</strong> ${data.error}<br>
              <a href="/student/login" class="btn btn-primary btn-sm" style="margin-top:0.6rem; display:inline-flex;">Open Student Portal</a>
            `;
          } else {
            alertBox.style.display = 'block';
            alertBox.style.background = 'rgba(244, 63, 94, 0.15)';
            alertBox.style.border = '1px solid #f43f5e';
            alertBox.style.color = '#fb7185';
            alertBox.textContent = data.error || 'Authentication failed.';
          }
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = 'Sign In to Teacher Dashboard';
          return;
        }

        // Success
        api.setToken(data.token);
        api.setUser(data.user);
        window.showToast('Welcome back, ' + data.user.name + '!', 'success');

        setTimeout(() => {
          window.location.href = '/teacher/dashboard';
        }, 600);

      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(244, 63, 94, 0.15)';
        alertBox.style.border = '1px solid #f43f5e';
        alertBox.style.color = '#fb7185';
        alertBox.textContent = err.message || 'Server connection error.';
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = 'Sign In to Teacher Dashboard';
      }
    });
  </script>
</body>
</html>
